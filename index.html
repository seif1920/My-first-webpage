
<!DOCTYPE html>
<html>
<head>
  <title>My Information</title>
  <style>
    body {
      background-color: #d6f5d6; /* لون الخلفية الأخضر الفاتح */
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .info-box {
      background: white;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      padding: 20px;
      width: 250px;
    }
    .info-box h2 {
      background-color: #4CAF50; /* لون العنوان الأخضر */
      color: white;
      margin: -20px -20px 20px -20px;
      padding: 10px;
      border-radius: 10px 10px 0 0;
      text-align: center;
    }
    .info-box table {
      width: 100%;
    }
    .info-box td {
      padding: 5px 0;
    }
    .label {
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="info-box">
    <h2>My Information</h2>
    <table>
      <tr><td class="label">Name</td><td>Seif eldin</td></tr>
      <tr><td class="label">Group</td><td>و</td></tr>
      <tr><td class="label">ID</td><td>20232238</td></tr>
      <tr><td class="label">Age</td><td>20</td></tr>
    </table>
  </div>
</body>
</html>
